global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'incident-manager'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'incident-manager:8080' ]
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'notification-service:8081' ]
